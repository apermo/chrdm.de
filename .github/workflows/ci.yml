name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Check PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 -P 4 php -l

  security:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Check for security vulnerabilities
        run: composer audit

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest

    # Boots a real WordPress install with every plugin active. This is the gate
    # that makes Renovate automerge defensible: `composer validate` and `php -l`
    # cannot catch a dependency update that fatals on plugin activation or
    # white-screens the front page.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, mysqli
          tools: composer:v2, wp-cli

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Build sovereignty theme assets
        # The theme ships no style.css — it is compiled from src/ by this
        # action, so WordPress cannot activate the theme without it. Running
        # the same pinned action the deploy uses also means a sovereignty
        # release whose asset build breaks now fails the merge rather than
        # the deploy.
        uses: apermo/sovereignty/.github/actions/build@v2.0.2
        with:
          working-directory: web/app/themes/sovereignty

      - name: Write CI environment
        run: |
          set -eu
          cat > .env <<'ENV'
          DB_NAME='wordpress'
          DB_USER='root'
          DB_PASSWORD='wordpress'
          DB_HOST='127.0.0.1:3306'
          DB_PREFIX='wp_'

          WP_HOME='http://127.0.0.1:8080'
          WP_SITEURL="${WP_HOME}/wp"

          # Installed as a single site first and converted below: WordPress
          # cannot bootstrap with MULTISITE=true before the network tables
          # exist. Subdirectory rather than the production subdomain layout,
          # because wildcard hosts are not resolvable on the runner.
          WP_ALLOW_MULTISITE=true
          MULTISITE=false
          SUBDOMAIN_INSTALL=false
          DOMAIN_CURRENT_SITE='127.0.0.1:8080'
          PATH_CURRENT_SITE='/'
          SITE_ID_CURRENT_SITE=1
          BLOG_ID_CURRENT_SITE=1

          WP_ENV='development'
          WP_DEBUG=true
          WP_DEBUG_LOG=true
          WP_DEBUG_DISPLAY=false
          ENV
          for key in AUTH_KEY SECURE_AUTH_KEY LOGGED_IN_KEY NONCE_KEY \
                     AUTH_SALT SECURE_AUTH_SALT LOGGED_IN_SALT NONCE_SALT; do
            printf "%s='%s'\n" "$key" "$(openssl rand -hex 32)" >> .env
          done

      - name: Install WordPress multisite
        run: |
          set -eu
          wp core install \
            --url=http://127.0.0.1:8080 \
            --title='chrdm.de CI' \
            --admin_user=admin \
            --admin_email=ci@example.tld \
            --admin_password=ci-smoke-test \
            --skip-email
          # --skip-config: Bedrock keeps its constants in config/application.php,
          # so WP-CLI must not try to rewrite web/wp-config.php.
          wp core multisite-convert --title='chrdm.de CI Network' --skip-config
          sed -i "s/^MULTISITE=false$/MULTISITE=true/" .env
          wp core is-installed --network

      - name: Activate theme and all plugins
        run: |
          set -eu
          wp theme enable sovereignty --network --activate

          # One invocation per plugin, not `--all`: a plugin that redirects on
          # activation (activitypub does) ends the WP-CLI process, and with
          # `--all` that silently abandons every plugin after it. Individual
          # exit codes are ignored for the same reason — the activation may
          # well have succeeded before the redirect aborted the command — so
          # the real assertion is that nothing is left inactive afterwards.
          expected="$(wp plugin list --status=inactive --format=count)"

          # Activated on the network's main site, not network-wide. Network
          # plugins are included before wp_cookie_constants() runs, and
          # several of these call wp_get_current_user() at include time, which
          # fatals on an undefined AUTH_COOKIE. Per-site activation loads them
          # in the normal active_plugins phase, which is how they run in
          # production and on almost every real install.
          for plugin in $(wp plugin list --status=inactive --field=name); do
            wp plugin activate "$plugin" || true
          done

          # Whatever refused is declared Network-only in its header, so it can
          # only be activated the other way.
          for plugin in $(wp plugin list --status=inactive --field=name); do
            wp plugin activate "$plugin" --network || true
          done

          remaining="$(wp plugin list --status=inactive --format=count)"
          if [ "$remaining" -ne 0 ]; then
            echo "::error::$remaining of $expected plugins failed to activate"
            wp plugin list --status=inactive --fields=name,status,version
            exit 1
          fi
          echo "network-activated $expected plugins"

          # Bootstrapping WordPress once more surfaces fatals raised by code
          # that only runs after activation (init hooks, option upgrades).
          wp eval 'echo "bootstrap ok\n";'

      - name: Boot the site and assert it responds
        run: |
          set -eu
          # Server and assertions live in one step on purpose: a background
          # process started in a previous step is not guaranteed to survive
          # the step boundary on GitHub-hosted runners.
          php -S 127.0.0.1:8080 -t web > "$RUNNER_TEMP/server.log" 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/wp/wp-login.php; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::PHP built-in server never became ready"
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi

          fail=0
          check() {
            code=$(curl -s -o "$RUNNER_TEMP/body.html" -w '%{http_code}' "$1")
            case "$code" in
              $2) echo "OK   $1 -> $code" ;;
              *)  echo "::error::$1 returned $code, expected $2"; fail=1 ;;
            esac
            # WordPress swallows fatals into a generic error page that can
            # still answer 200, so the body has to be checked as well.
            if grep -q 'There has been a critical error' "$RUNNER_TEMP/body.html"; then
              echo "::error::$1 rendered WordPress's critical-error page"
              fail=1
            fi
          }
          check http://127.0.0.1:8080/ '200'
          check http://127.0.0.1:8080/wp/wp-login.php '200'
          check http://127.0.0.1:8080/wp/wp-admin/ '30[0-9]'
          exit "$fail"

      - name: Assert no PHP fatals were logged
        if: always()
        run: |
          set -eu
          fail=0
          for log in "$RUNNER_TEMP/server.log" web/app/debug.log; do
            [ -f "$log" ] || continue
            if grep -Eq 'PHP (Fatal error|Parse error)' "$log"; then
              echo "::error::fatals in $log"
              grep -E -A3 'PHP (Fatal error|Parse error)' "$log"
              fail=1
            fi
          done
          exit "$fail"
