name: Release

on:
  # Primary trigger. GitHub creates scheduled runs 3-6 hours after the cron
  # (measured: created_at equals run_started_at, and the job itself finishes
  # in seconds, so the lateness is GitHub's scheduler, not our queue). Firing
  # off CI instead releases within minutes of a merge.
  #
  # This does not weaken batching: Renovate is the batcher, not this cron. Its
  # "before 06:00" schedule and group rules collapse the night's updates into
  # one PR, so one merge still means one release.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  schedule:
    # Fallback only, for a merge whose CI run never reported. Late is fine
    # here; the guard makes a redundant firing a no-op.
    - cron: '23 6 * * *'   # 08:23 CEST / 07:23 CET
    - cron: '23 9 * * *'   # 11:23 CEST / 10:23 CET
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be released without creating a tag.
        type: boolean
        default: false

concurrency:
  # Never race a manual `git push --tags`.
  group: release

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Cut dependency release
    runs-on: ubuntu-latest
    # Never release off a red main. Schedule and manual dispatch carry no
    # conclusion, so they fall through to the guard in the step below.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          # Always release from main, whatever ref a manual dispatch used.
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Cut tag and trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')"
          range="$last..HEAD"
          echo "Last release: $last"

          if [ "$(git rev-list --count --no-merges "$range")" -eq 0 ]; then
            echo "Nothing new since \`$last\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The safety guard: this workflow only ever ships batches Renovate
          # produced. Anything else on main is your work, and stays yours to
          # release — the process degrades to the manual `git tag` path.
          human="$(git log --no-merges --format='%s' "$range" | grep -cv '^chore(deps)' || true)"
          if [ "$human" -gt 0 ]; then
            {
              echo "### Release skipped"
              echo
              echo "$human non-dependency commit(s) on \`main\` since \`$last\`. Tag manually:"
              echo
              git log --no-merges --format='- %s' "$range" | grep -v '^- chore(deps)'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Human changes on main since $last — release manually."
            exit 0
          fi

          # Automated dependency releases take the patch digit; minor stays
          # reserved for hand-cut feature releases, so any x.y.Z tag is known
          # to contain nothing but dependency bumps.
          core="${last#v}"
          rest="${core#*.}"
          next="v${core%%.*}.${rest%%.*}.$(( ${rest#*.} + 1 ))"

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists"
            exit 1
          fi

          {
            echo "Automated dependency release."
            echo
            git log --no-merges --format='- %s' "$range"
          } > "$RUNNER_TEMP/notes.md"

          {
            echo "### $next"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Dry run — no tag created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Annotated, so deploy.yml's `release` job reuses this body as the
          # GitHub Release notes instead of falling back to --generate-notes.
          git tag -a "$next" -F "$RUNNER_TEMP/notes.md"
          git push origin "$next"

          # A tag pushed with GITHUB_TOKEN does not fire deploy.yml's
          # `push: tags` trigger — GitHub suppresses recursive workflow
          # triggers. workflow_dispatch is the documented exception, and
          # dispatching against the tag ref keeps github.ref pointing at the
          # tag, so the version string and the tag-only jobs behave exactly
          # as they do for a hand-pushed tag.
          gh workflow run deploy.yml --ref "$next"

          # `gh workflow run` reports success for the dispatch being accepted,
          # not for a run actually starting. Without this check a silent no-op
          # would leave the tag and the GitHub Release in place, this job
          # green, and nothing deployed — the failure mode hardest to notice.
          run_id=""
          for _ in $(seq 1 12); do
            sleep 5
            run_id="$(gh run list --workflow deploy.yml --branch "$next" \
                        --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              break
            fi
          done

          if [ -z "$run_id" ]; then
            echo "::error::Deploy dispatch for $next produced no run — $next is tagged but NOT deployed. Re-run the Deploy workflow against the tag."
            echo "**$next is tagged but not deployed** — the deploy dispatch produced no run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Deploy run $run_id started for $next."
          echo "Deploy run [$run_id]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id) started." >> "$GITHUB_STEP_SUMMARY"
